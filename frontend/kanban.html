<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Kanban - Gerenciador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./global.css">
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./version.css">
</head>
<body>
    <!-- Aplicação Principal -->
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Gerenciador</h2>
            </div>
            <ul class="nav-links">
                <li><a href="tasks.html" id="nav-list">Lista de Tarefas</a></li>
                <li><a href="kanban.html" id="nav-kanban" class="active">Quadro Kanban</a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-secondary">Sair</button>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- View Kanban -->
            <div id="kanban-view" class="view-section">
                <header class="app-header">
                    <h1>Quadro Kanban</h1>
                    <p class="subtitle">Acompanhe o fluxo das suas tarefas</p>
                </header>
                
                <div class="kanban-board-wrapper">
                    <div class="kanban-board" id="kanban-board-element">
                        <!-- Renderizado via JavaScript -->
                    </div>
                    <div class="add-column-container v1-2-only" id="add-column-container">
                        <button class="btn-add-column" id="add-column-btn">+ Adicionar Coluna</button>
                        <div class="add-column-form hidden" id="add-column-form">
                            <input type="text" id="new-column-title" placeholder="Nome da coluna..." autocomplete="off">
                            <div class="add-column-actions">
                                <button class="btn-save-column" id="save-column-btn">Salvar</button>
                                <button class="btn-cancel-column" id="cancel-column-btn">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./api.js"></script>
    <script src="./auth.js"></script>
    <script src="./kanban.js"></script>
    <script src="./version.js"></script>
</body>
</html>
