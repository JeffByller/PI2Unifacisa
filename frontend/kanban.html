<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Kanban - Gerenciador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./global.css">
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./version.css">
</head>
<body>
    <!-- Aplicação Principal -->
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Gerenciador</h2>
            </div>
            <ul class="nav-links">
                <li><a href="tasks.html" id="nav-list">Lista de Tarefas</a></li>
                <li><a href="kanban.html" id="nav-kanban" class="active">Quadro Kanban</a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-secondary">Sair</button>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- View Kanban -->
            <div id="kanban-view" class="view-section">
                <header class="app-header">
                    <h1>Quadro Kanban</h1>
                    <p class="subtitle">Acompanhe o fluxo das suas tarefas</p>
                </header>
                
                <div class="kanban-board-wrapper">
                    <div class="kanban-board" id="kanban-board-element">
                        <!-- Renderizado via JavaScript -->
                    </div>
                    <div class="add-column-container v1-2-only" id="add-column-container">
                        <button class="btn-add-column" id="add-column-btn">+ Adicionar Coluna</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Coluna (Adicionar/Editar) -->
    <div id="column-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="column-modal-title">Nova Coluna</h3>
                <button class="modal-close" id="column-modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="column-modal-id">
                <input type="hidden" id="column-modal-status">
                <div class="input-group">
                    <label for="column-modal-name">Nome da Coluna</label>
                    <input type="text" id="column-modal-name" placeholder="Ex: Em Teste" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="column-modal-save-btn">Salvar</button>
                <button class="btn-danger hidden" id="column-modal-delete-btn">Excluir Coluna</button>
                <button class="btn-secondary" id="column-modal-cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Tarefa (Editar/Excluir) -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Editar Tarefa</h3>
                <button class="modal-close" id="task-modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="task-modal-id">
                
                <div class="input-group">
                    <label for="task-modal-title">Título da Tarefa</label>
                    <input type="text" id="task-modal-title" placeholder="Título..." autocomplete="off">
                </div>

                <div class="input-group">
                    <label>Prioridade</label>
                    <div class="priority-selector">
                        <label class="radio-label">
                            <input type="radio" name="task-modal-priority" value="#3b82f6">
                            <span class="radio-custom priority-low" title="Comum"></span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="task-modal-priority" value="#eab308">
                            <span class="radio-custom priority-medium" title="Importante"></span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="task-modal-priority" value="#ef4444">
                            <span class="radio-custom priority-high" title="Urgente"></span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="task-modal-status">Coluna (Status)</label>
                    <select id="task-modal-status">
                        <!-- Colunas dinâmicas preenchidas via JS -->
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="task-modal-save-btn">Salvar Alterações</button>
                <button class="btn-danger" id="task-modal-delete-btn">Excluir Tarefa</button>
                <button class="btn-secondary" id="task-modal-cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="./api.js"></script>
    <script src="./auth.js"></script>
    <script src="./kanban.js"></script>
    <script src="./version.js"></script>
</body>
</html>
